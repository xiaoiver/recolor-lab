<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recolor Lab · 视频换色示例</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="./">RECOLOR <span>LAB</span></a><span class="example-label">视频换色示例</span></header>
<main>
  <div class="page-heading"><h1>点选画面，试试新颜色。</h1><p>衬衫、外套和右侧柔光箱，可以分别调色。</p></div>
  <div class="workspace">
    <section class="viewer" aria-label="视频预览">
      <div class="stage" id="stage"><canvas id="output" width="640" height="360" aria-label="换色视频预览"></canvas><canvas id="outline" width="640" height="360" hidden aria-hidden="true"></canvas><canvas id="local-mask" width="640" height="360" hidden aria-hidden="true"></canvas><div class="loading" id="loading" role="status">正在载入示例…</div></div>
      <div class="transport"><button id="play" aria-label="播放或暂停" disabled>播放</button><span id="time">00:00 / 00:02</span><input id="seek" type="range" min="0" max="2" step="0.001" value="0" aria-label="视频进度" disabled><button id="loop" aria-label="循环播放" aria-pressed="true" data-cycles="0">循环</button><button id="snapshot" disabled>保存画面</button></div>
      <div class="viewbar"><div class="views" role="group" aria-label="预览方式"><button data-view="edit" aria-pressed="true">换色</button><button data-view="split" aria-pressed="false">对比</button><button data-view="original" aria-pressed="false">原片</button><button data-view="mask" aria-pressed="false">选区</button></div><button id="toggle-outline" class="outline-button" aria-pressed="false">显示轮廓</button></div>
      <div id="split-controls" class="split-controls" hidden><label for="split">对比分界 <output id="split-value">50%</output></label><input id="split" type="range" min="0" max="1" step="0.01" value="0.5"></div>
      <p id="status" role="status">点选画面中的目标，或用右侧按钮切换。</p>
    </section>
    <aside class="inspector" aria-label="调色面板">
      <div class="section-title"><h2>编辑目标</h2><button id="reset-all" class="text-button">全部还原</button></div>
      <div id="targets" class="targets" role="group" aria-label="编辑目标"></div>
      <div class="color-heading"><h2 id="editing-target">衬衫</h2><button id="reset" class="text-button">还原当前</button></div>
      <div class="color-editor">
        <div class="wheel-wrap"><canvas id="color-wheel" width="220" height="220" role="slider" tabindex="0" aria-label="色轮：左右调整色相，上下调整饱和度" aria-valuemin="0" aria-valuemax="360"></canvas><span id="wheel-cursor" class="wheel-cursor"></span></div>
        <div class="color-fields">
          <label for="hex">颜色</label><div class="color-entry"><span id="color-preview" aria-hidden="true"></span><input id="hex" type="text" value="#6E89E8" maxlength="7" spellcheck="false" aria-label="十六进制颜色"></div>
          <div class="swatches" id="swatches" aria-label="预设颜色"></div>
          <label for="wheel-value">颜色亮度</label><input id="wheel-value" class="wheel-value" type="range" min="0" max="100" step="1" value="91" aria-label="颜色亮度">
          <label for="amount">换色强度 <output id="amount-value">100%</output></label><input id="amount" type="range" min="0" max="1" step="0.01" value="1">
        </div>
      </div>
      <details class="advanced"><summary>更多调整</summary><label for="lightness">明暗 <output id="lightness-value">0.00</output></label><input id="lightness" type="range" min="-0.25" max="0.25" step="0.01" value="0"><label for="threshold">边缘范围 <output id="threshold-value">0.50</output></label><input id="threshold" type="range" min="0.1" max="0.9" step="0.01" value="0.5"></details>
      <p class="inspector-note">每个目标独立保存颜色，切换时保留已有修改。</p>
      <details class="local-sam" id="local-sam"><summary>端侧 SAM 2 首帧点选（实验）</summary><p>按需下载约 151 MB 模型，在浏览器 Worker 中以 WebGPU 优先运行；默认示例不会加载它。</p><div class="local-sam-actions"><button id="local-sam-load">加载并编码首帧</button><button id="local-sam-mode" aria-pressed="false" disabled>使用本地点选</button></div><p id="local-sam-status" class="local-sam-status">未加载。此功能只生成首帧候选，不会替代已有的视频跟踪缓存。</p><div id="local-sam-candidates" class="local-sam-candidates" hidden aria-label="本地分割候选"></div></details>
    </aside>
  </div>
  <footer><span>示例已缓存跟踪结果，调色在本机完成。</span><span id="renderer-label"></span></footer>
</main>
<video id="video" playsinline preload="auto" muted loop hidden></video><script type="module" src="example.js"></script>
</body></html>
